name: Data Sharing Demo

on: push

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1
        run: |
          APP_VERSION="2.5.0"
          echo "Version: $APP_VERSION"
          bash -c 'echo "$APP_VERSION"'    #without export even shell variable cannot be access by child process

      - name: Step 2
        run: |
          echo "Version: $APP_VERSION"

  variable-test-export:
    runs-on: ubuntu-latest

    steps:
       - name : Share variable
         run: |
            export CITY="MANGALURU"
            echo "Step 1: $CITY"
            bash -c 'echo "$CITY"'
       
       - name : Read exported variable
         run: |
            echo "Step 2: $CITY"
  
  variable-test-github-env:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Share variable using github env
        run: |
          COUNTRY="India"
          echo "COUNTRY=$COUNTRY" >> "$GITHUB_ENV"
          echo "Step 1: $COUNTRY"

      - name: Step 2 - Read shared variable
        run: |
          echo "Step 2: $COUNTRY"

  variable-test-github-output:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1 - Calulate total
        id: calculation

        run: |
          TOTAL=5000
          echo "result_value=$TOTAL" >>$GITHUB_OUTPUT

      - name: Step 2 - Display total 
        run: |
          echo "Total : ${{ steps.calculation.outputs.RESULT_VALUE}}"   #the github named output is case sensitive

  multiple-step-outputs:
     runs-on: ubuntu-latest

     steps:
       - name: Step 1 - publish multiple outputs
         id: defination

         run: |
            VERSION=2.5.0
            ENVIRONMENT="production"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

       - name: Step 2 - accessing the github o.p

         run: |
             echo ${{ steps.defination.outputs.version }}
             echo ${{ steps.defination.outputs.environment }}

  overwriting-github-env:
     runs-on: ubuntu-latest

     steps:
        - name: Step 1 - publish github env 1
          run: echo "CITY=mangalore" >> $GITHUB_ENV
        - name: Step 2 - publish github env 2
          run: echo "CITY=bengaluru" >> $GITHUB_ENV
        - name: Step 3 - accessing the result_value
          run: echo $CITY
  
  accessing-within-same-step:
     runs-on: ubuntu-latest

     steps:
        - name: publishing and accessing within same step
          id: access_same
          run: |
            TOTAL=5000
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

            echo "value is ${{ steps.access_same.outputs.total }}"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate Build Version
        id: calculation
        run: |
          echo "build_version=2.5.0" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Display version
        run: |
          echo "${{ steps.calculation.outputs.build_version }}"
        


    
