name: status-functions

on: push

jobs:
    execution-order-steps:
      runs-on: ubuntu-latest
      steps:
          - name: Step 1
            run: echo "Starting tests"

          - name: Step 2
            run: exit 1

          - name: Step 3
            run: echo "Tests completed"  
  #by default in github actions execution of steps depends on the previous step execution status

    test:
      runs-on: ubuntu-latest
      steps: 
         - name: Step 1 - Successful step
           run: echo "Step 1 executed successfully"

         - name: Step 2 - Intentional failure
           run: |
              echo "Step 2 is going to fail"
              exit 1

         - name: Step 3 - Success condition
           if: success()
           run: echo "Success condition executed"
        
         - name: Step 4 - Failure condition
           if: failure()
           run: echo "Failure condition executed"

         - name: Step 5 - After Failure condition check
           if: success()
           run: echo "success condition executed"
           
    failure-behaviour-check:
          runs-on: ubuntu-latest
          steps: 
            - name: Step 1 
              run: echo "Step 1 executed successfully"
            - name: Step 2
              if: failure()
              run: echo "Failure condition executed"
            - name: Step 3
              if: success()
              run: echo "Success condition executed"

    workflow_validation:
         runs-on: ubuntu-latest
         steps: 
             - name: step 1
               run: echo "step 1 executed"
             - name: step 2
               run: exit 1
             - name: step 3
               if: always()
               run: echo "step will be executed even if step failed or succeeded"
             - name: step 4
               run: echo "success executed"
    cancellation_check:
      runs-on: ubuntu-latest

      steps:
        - name: Step 1
          run: echo "Starting workflow"

        - name: Step 2
          run: sleep 10

        - name: Step 3
          if: cancelled()
          run: echo "Workflow cancellation detected"

        # - name: Step 4
        #   if: always()
        #   run: echo "Always condition executed"

        - name: Step 4
          if: success()
          run: echo "execute step 4"
      